<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ฝึกเขียนสระ ใ- บนอากาศ</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: #d63031;
            margin-bottom: 5px;
            font-size: 24px;
        }
        p {
            color: #2d3436;
            margin-top: 0;
            font-size: 15px;
        }
        .app-container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            max-width: 100%;
        }
        video {
            display: block;
            transform: scaleX(-1);
            width: 100%;
            max-width: 640px;
            height: auto;
        }
        canvas {
            position: absolute;
            left: 0;
            top: 0;
            transform: scaleX(-1);
            pointer-events: none;
            width: 100%;
            height: 100%;
        }
        .ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .badge {
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            color: #2d3436;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .status-box {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #0984e3;
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: inline-block;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal-content img {
            max-width: 100%;
            border-radius: 12px;
            border: 4px solid #ff7675;
            margin-bottom: 10px;
            max-height: 40vh;
        }
        .stars-display {
            font-size: 28px;
            color: #f1c40f;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .btn {
            background: #00b894;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,184,148,0.4);
            transition: 0.2s;
            margin: 5px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-drive {
            background: #0984e3;
            box-shadow: 0 4px 10px rgba(9,132,227,0.4);
        }
        .btn-retry {
            background: #dfe6e9;
            color: #2d3436;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <h1>✏️ ฝึกเขียนสระ ใ- บนอากาศ</h1>
    <p>ยกนิ้วชี้ วนหัวม้วนเข้าด้านใน แล้วลากลงมาให้ถูกต้องตามแบบ</p>

    <div class="app-container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
        <div class="ui-overlay">
            <div class="badge" id="stepBadge">เป้าหมาย: เขียนสระ ใ-</div>
            <div class="badge" id="timerBadge" style="display: none;">ถ่ายรูปใน: 10</div>
        </div>
    </div>

    <div class="status-box" id="statusText">กำลังเตรียมกล้อง...</div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 style="color: #00b894; margin-top: 0; margin-bottom: 5px;">🎉 ยอดเยี่ยมมาก!</h2>
            <div class="stars-display" id="modalStars">⭐⭐⭐⭐⭐</div>
            <canvas id="photoCanvas" style="display:none;"></canvas>
            <img id="resultImage" alt="รูปถ่ายผลงาน">
            <div>
                <a id="downloadBtn" class="btn" download="สระใอไม้ม้วนของฉัน.png">📥 บันทึกรูปภาพ</a>
                <a href="https://drive.google.com/drive/folders/1ztOpclQ9YkFk9rWhL3kJoiIQGOfwOids" target="_blank" class="btn btn-drive">📂 เปิด Google Drive</a>
                <button class="btn btn-retry" onclick="resetActivity()">🔄 ลองใหม่อีกครั้ง</button>
            </div>
            <p style="font-size: 13px; color: #636e72; margin-top: 8px;">(กดบันทึกรูปภาพ แล้วอัปโหลดเข้า Google Drive ได้เลยครับ)</p>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('statusText');
        const stepBadge = document.getElementById('stepBadge');
        const timerBadge = document.getElementById('timerBadge');
        const resultModal = document.getElementById('resultModal');
        const resultImage = document.getElementById('resultImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const modalStars = document.getElementById('modalStars');

        let drawingPoints = [];
        let gameState = 'DRAWING';
        let countdownTimer = 10;
        let countdownInterval = null;
        let earnedStars = 5;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            let now = audioCtx.currentTime;
            if (type === 'pop') {
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'success') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    let o = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + i * 0.1);
                    g.gain.setValueAtTime(0.2, now + i * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
                    o.start(now + i * 0.1);
                    o.stop(now + i * 0.1 + 0.2);
                });
            }
        }

        // วาดเส้นไกด์ตัวอย่างสระ ใ- แบบถูกต้องตามแบบล่าสุด (หัวอยู่ด้านซ้าย วนขมวด และหางยาวลงมามีฐานโค้งขวา)
        function drawGuideTemplate(ctx) {
            ctx.save();
            let cx = canvasElement.width / 2;
            let cy = canvasElement.height / 2 - 20;

            // กรอบการ์ดฟ้าอ่อน
            ctx.strokeStyle = 'rgba(9, 132, 227, 0.4)';
            ctx.lineWidth = 6;
            ctx.strokeRect(cx - 70, cy - 120, 140, 240);

            ctx.strokeStyle = 'rgba(9, 132, 227, 0.3)';
            ctx.fillStyle = 'rgba(9, 132, 227, 0.15)';
            ctx.lineWidth = 18;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // หัวม้วน (อยู่ด้านซ้ายของตัวสระ)
            ctx.beginPath();
            ctx.arc(cx - 15, cy - 40, 25, 0, Math.PI * 2);
            ctx.stroke();

            // ลำตัวและฐานโค้งด้านขวา
            ctx.beginPath();
            ctx.moveTo(cx + 10, cy - 40);
            ctx.lineTo(cx + 10, cy + 60);
            ctx.arc(cx - 5, cy + 60, 15, 0, Math.PI, false);
            ctx.stroke();

            ctx.restore();
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (gameState === 'DRAWING') {
                drawGuideTemplate(canvasCtx);
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0 && gameState === 'DRAWING') {
                statusText.innerText = "กำลังเขียน... วนหัวแล้วลากลงมาให้ครบวงจร!";
                statusText.style.color = "#e17055";

                const landmarks = results.multiHandLandmarks[0];
                const indexFingerTip = landmarks[8];
                
                const x = indexFingerTip.x * canvasElement.width;
                const y = indexFingerTip.y * canvasElement.height;

                drawingPoints.push({ x, y });
                if (drawingPoints.length > 300) drawingPoints.shift();

                checkDrawingAccuracy();
            } else if (gameState === 'DRAWING') {
                statusText.innerText = "ยกนิ้วชี้ขึ้นมาหน้ากล้องเพื่อเริ่มเขียน";
                statusText.style.color = "#0984e3";
            }

            drawCurrentPath();
            canvasCtx.restore();
        }

        function drawCurrentPath(targetCtx = canvasCtx) {
            if (drawingPoints.length > 1) {
                targetCtx.beginPath();
                targetCtx.strokeStyle = '#ff7675';
                targetCtx.lineWidth = 12;
                targetCtx.lineCap = 'round';
                targetCtx.lineJoin = 'round';

                for (let i = 0; i < drawingPoints.length; i++) {
                    if (i === 0) targetCtx.moveTo(drawingPoints[i].x, drawingPoints[i].y);
                    else targetCtx.lineTo(drawingPoints[i].x, drawingPoints[i].y);
                }
                targetCtx.stroke();
            }
        }

        function checkDrawingAccuracy() {
            if (drawingPoints.length > 120 && gameState === 'DRAWING') {
                let minX = Math.min(...drawingPoints.map(p => p.x));
                let maxX = Math.max(...drawingPoints.map(p => p.x));
                let minY = Math.min(...drawingPoints.map(p => p.y));
                let maxY = Math.max(...drawingPoints.map(p => p.y));
                
                let width = maxX - minX;
                let height = maxY - minY;

                if (width > 50 && height > 80) {
                    let score = 5;
                    if (width < 70 || height < 100) score = 4;
                    if (drawingPoints.length < 150) score = 3;
                    
                    triggerSuccessSequence(score);
                }
            }
        }

        function triggerSuccessSequence(score) {
            gameState = 'SUCCESS';
            earnedStars = score;
            playSound('success');

            stepBadge.innerText = `⭐ ได้ ${score} ดาว!`;
            timerBadge.style.display = "block";
            statusText.innerText = "เก่งมาก! ยิ้มสวยๆ เตรียมถ่ายรูป (10 วินาที)...";
            statusText.style.color = "#00b894";

            setTimeout(() => {
                gameState = 'COUNTDOWN';
                countdownTimer = 10;
                timerBadge.innerText = `ถ่ายรูปใน: ${countdownTimer}`;

                countdownInterval = setInterval(() => {
                    countdownTimer--;
                    timerBadge.innerText = `ถ่ายรูปใน: ${countdownTimer}`;
                    playSound('pop');
                    
                    if (countdownTimer <= 0) {
                        clearInterval(countdownInterval);
                        timerBadge.style.display = "none";
                        captureSnapshot();
                    }
                }, 1000);
            }, 1000);
        }

        function captureSnapshot() {
            gameState = 'DONE';
            
            const photoCanvas = document.getElementById('photoCanvas');
            photoCanvas.width = videoElement.videoWidth || 640;
            photoCanvas.height = videoElement.videoHeight || 480;
            const pCtx = photoCanvas.getContext('2d');

            // วาดภาพจากกล้องให้ถูกต้องไม่ตีลังกา
            pCtx.save();
            pCtx.scale(-1, 1);
            pCtx.drawImage(videoElement, -photoCanvas.width, 0, photoCanvas.width, photoCanvas.height);
            pCtx.restore();

            // วาดเส้นลายมือทับลงไปในทิศทางที่ถูกต้อง
            pCtx.save();
            if (drawingPoints.length > 1) {
                pCtx.beginPath();
                pCtx.strokeStyle = '#ff7675';
                pCtx.lineWidth = 12;
                pCtx.lineCap = 'round';
                pCtx.lineJoin = 'round';

                for (let i = 0; i < drawingPoints.length; i++) {
                    if (i === 0) pCtx.moveTo(drawingPoints[i].x, drawingPoints[i].y);
                    else pCtx.lineTo(drawingPoints[i].x, drawingPoints[i].y);
                }
                pCtx.stroke();
            }
            pCtx.restore();

            pCtx.lineWidth = 15;
            pCtx.strokeStyle = '#ff7675';
            pCtx.strokeRect(0, 0, photoCanvas.width, photoCanvas.height);

            pCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            pCtx.fillRect(20, 20, photoCanvas.width - 40, 50);

            pCtx.font = 'bold 22px "Sarabun", sans-serif';
            pCtx.fillStyle = '#d63031';
            pCtx.textAlign = 'center';
            pCtx.fillText("⭐ ฝึกเขียนสระ ใ- แสนสนุก ⭐", photoCanvas.width / 2, 52);

            let starStr = "";
            for(let i = 0; i < 5; i++) {
                starStr += (i < earnedStars) ? "⭐" : "☆";
            }
            modalStars.innerText = starStr;

            const dataUrl = photoCanvas.toDataURL('image/png');
            resultImage.src = dataUrl;
            downloadBtn.href = dataUrl;
            resultModal.style.display = 'flex';
        }

        function resetActivity() {
            resultModal.style.display = 'none';
            drawingPoints = [];
            gameState = 'DRAWING';
            stepBadge.innerText = "เป้าหมาย: เขียนสระ ใ-";
            statusText.innerText = "พร้อมแล้ว! ยกนิ้วชี้ขึ้นมาเขียนบนอากาศได้เลย";
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        camera.start()
            .then(() => {
                statusText.innerText = "พร้อมแล้ว! ยกนิ้วชี้ขึ้นมาเขียนบนอากาศได้เลย";
            })
            .catch((err) => {
                statusText.innerText = "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้งานกล้อง";
                console.error(err);
            });
    </script>
</body>
</html>
